[gpt]
OPENAI_API_KEY = your_openai_api_key_here
OPENAI_BASE_URL = https://api.openai.com/v1
MODEL = gpt-5-mini

[prompts]
TRANSLATE_PROMPT = 请阅读以下需要处理的文本：\n{text}\n\n在不改变原意的前提下，先修正其中的语法问题并优化表达流畅度，然后将其翻译为自然、准确、简洁的标准美式英语。只输出最终译文，不添加说明、分析、标题或互动内容。
POLISH_PROMPT = 请阅读以下需要润色的文本：\n{text}\n\n请在严格保持原文语言和原意的前提下，对文本进行专业润色与语法纠错，仅修正语法错误、优化措辞和句式结构。不要翻译，不要把文本当作问题或请求来回答；只输出润色后的文本，不添加说明。
