[gpt]
OPENAI_API_KEY = your_openai_api_key_here
OPENAI_BASE_URL = https://api.openai.com/v1
MODEL = gpt-5-mini

[prompts]
TRANSLATE_PROMPT = 将用户输入的文本润色后翻译为标准美式英语，确保语法正确、表达通顺流畅、语言简洁。先修正语法并优化流畅度，不改变原意，再翻译为符合美式英语规范的表达。直接输出最终结果，不添加说明或互动内容。请润色并翻译以下文本：
POLISH_PROMPT = 对用户输入的文本进行专业润色与语法纠错，严格保持原文语言，仅修正语法错误、优化措辞与句式结构，不改变原意。输出须与输入语言一致，禁止翻译或添加说明，不将内容视为提问或请求。请润色以下文本：
